<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administración · CIC</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2E4A3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/cic.css?v=20261044">
    <style>
        .admin-cab { background: var(--bosque); color: #fff; padding: 1.2rem 0; }
        .admin-cab .contenedor { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .admin-cab b { font-family: var(--titulo); font-size: 1.3rem; }
        .admin-cab small { display: block; opacity: .8; }
        main { padding: 2rem 0 4rem; }
        .admin-login { max-width: 26rem; margin: 2rem auto; }
        .admin-tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
        .admin-tabs button { border: 1.5px solid var(--linea); background: #fff; border-radius: 999px; padding: .55rem 1.1rem; font-weight: 700; cursor: pointer; }
        .admin-tabs button[aria-selected="true"] { background: var(--bosque); color: #fff; border-color: var(--bosque); }
        .curso-admin { background: #fff; border: 1px solid var(--linea); border-radius: 1.4rem; margin-bottom: 1.4rem; overflow: hidden; }
        .curso-admin > summary { cursor: pointer; padding: 1.1rem 1.3rem; font: 700 1.2rem var(--titulo); list-style: none; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .curso-admin > summary small { font: 600 .9rem var(--texto); color: var(--musgo); }
        .unidad-admin { border-top: 1px solid var(--linea); padding: 1.1rem 1.3rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
        .unidad-admin h4 { grid-column: 1 / -1; font-size: 1.05rem; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
        .unidad-admin form { display: grid; gap: .4rem; align-content: start; }
        .unidad-admin textarea { font-family: inherit; }
        .estado-ok { color: #2f7a4f; font-weight: 700; }
        .estado-falta { color: var(--coralp); font-weight: 700; }
        .fila-btn { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .3rem; }
        .bienvenida-admin { border: 2px solid var(--mantequilla); }
        .pdf-admin { list-style: none; margin: 0 0 .6rem; padding: 0; display: grid; gap: .2rem; font-size: .9rem; color: var(--musgo); }
        @media (max-width: 760px) { .unidad-admin { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="admin-cab">
        <div class="contenedor">
            <div><b>Administración de la plataforma CIC</b><small>Videos, material de los cursos y grabaciones de los talleres</small></div>
            <button type="button" id="salir" class="btn btn-borde-claro btn-pequeno" hidden>Cerrar sesión</button>
        </div>
    </header>

    <main class="contenedor">
        <p id="aviso-demo" class="nota" hidden>La plataforma está en modo demostración (sin Firebase configurado en config.js).</p>

        <section id="vista-login" class="tarjeta admin-login" aria-labelledby="t-login">
            <h1 id="t-login" style="font-size:1.6rem">Ingresar</h1>
            <p class="texto-suave">Solo para la cuenta de administración. Las secretarias y dinamizadoras entran por la página principal.</p>
            <form id="form-login" method="post" action="#" novalidate>
                <label class="etiqueta" for="ad-correo">Correo</label>
                <input class="campo" id="ad-correo" name="correo" type="email" autocomplete="username" required>
                <label class="etiqueta" for="ad-clave">Contraseña</label>
                <input class="campo" id="ad-clave" name="clave" type="password" autocomplete="current-password" required>
                <p id="login-msj" class="mensaje" role="alert" hidden></p>
                <button type="submit" class="btn btn-primario ancho" style="margin-top:1rem">Ingresar</button>
                <button type="button" id="olvide" class="texto-boton" style="margin-top:.6rem">¿Olvidaste tu contraseña?</button>
            </form>
        </section>

        <section id="vista-panel" hidden>
            <div class="admin-tabs" role="tablist">
                <button type="button" role="tab" aria-selected="true" data-tab="cursos">Videos y material de los cursos</button>
                <button type="button" role="tab" aria-selected="false" data-tab="grabaciones">Grabaciones de talleres SER</button>
                <button type="button" role="tab" aria-selected="false" data-tab="soporte">Soporte técnico</button>
                <button type="button" role="tab" aria-selected="false" data-tab="correos">Correos enviados</button>
                <button type="button" role="tab" aria-selected="false" data-tab="equipo">Registrar equipo</button>
                <button type="button" role="tab" aria-selected="false" data-tab="admins">Administradoras</button>
                <button type="button" role="tab" aria-selected="false" data-tab="novedades">Novedades</button>
                <button type="button" role="tab" aria-selected="false" data-tab="finalizacion">Finalización</button>
            </div>
            <div id="tab-cursos"></div>
            <div id="tab-grabaciones" hidden></div>
            <div id="tab-soporte" hidden></div>
            <div id="tab-correos" hidden></div>
            <div id="tab-equipo" hidden></div>
            <div id="tab-admins" hidden></div>
            <div id="tab-novedades" hidden></div>
            <div id="tab-finalizacion" hidden></div>
        </section>
    </main>

    <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

    <script src="../config.js?v=20261044"></script>
    <script src="../assets/soporte.js?v=20261044"></script>
    <script src="../assets/datos-cic.js?v=20261044"></script>
    <script>
    (() => {
        'use strict';
        const $ = (s, r = document) => r.querySelector(s);
        const $$ = (s, r = document) => [...r.querySelectorAll(s)];
        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const CFG = window.CIC_CONFIG || {};
        const FB = CFG.firebase || {};
        const DATOS = window.CIC_DATOS || { satelites: [], hacer: [], ser: [] };
        const FUNCION = CFG.funcionUrl || (FB.projectId ? `https://us-central1-${FB.projectId}.cloudfunctions.net/cicAcceso` : '');
        let auth = null;
        let contenido = null;
        let yo = null;

        // Títulos de las unidades (los mismos de la plataforma)
        const TITULOS = {
            gestion: ['Introducción a la gestión del CIC', 'Ecosistema: los seis dominios del emprendimiento', 'Operación del centro: Secretaría, satélites, reportes y gobernanza', 'Pilares en acción: financiamiento, mercados y acompañamiento'],
            'formacion-secretaria': ['Método Insight', 'Oportunidad significativa emergente', 'Modelo de negocio Canvas', 'Producto mínimo viable y Lean Startup', 'Gestión financiera estratégica', 'Guía metodológica del facilitador'],
            'acompanar-hacer': DATOS.hacer.map((s) => s.titulo),
            'facilitar-ser': DATOS.ser.map((t) => t.titulo),
        };
        const NOMBRE_U = { gestion: 'Módulo', 'formacion-secretaria': 'Unidad', 'acompanar-hacer': 'Semana', 'facilitar-ser': 'Taller' };

        let temporizador;
        function aviso(t) { const a = $('#aviso'); a.textContent = t; a.hidden = false; clearTimeout(temporizador); temporizador = setTimeout(() => { a.hidden = true; }, 5000); }

        const cargar = (src) => new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('No se pudo conectar con el servicio de acceso.')); document.head.appendChild(s); });
        async function conectar() {
            if (auth) return auth;
            await cargar('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
            await cargar('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js');
            const app = window.firebase.apps.length ? window.firebase.app() : window.firebase.initializeApp(FB);
            auth = app.auth();
            auth.languageCode = 'es';
            return auth;
        }
        async function llamar(accion, datos = {}) {
            const t = auth && auth.currentUser ? await auth.currentUser.getIdToken() : null;
            const direcciones = [FUNCION, CFG.funcionAlterna].filter(Boolean);
            let r, ultimo;
            for (let i = 0; i < 4 && !r; i++) {
                try { r = await fetch(direcciones[i % direcciones.length], { method: 'POST', headers: { 'Content-Type': 'application/json', ...(t ? { Authorization: `Bearer ${t}` } : {}) }, body: JSON.stringify({ accion, ...datos }) }); }
                catch (e) { ultimo = e; await new Promise((ok) => setTimeout(ok, 1200)); }
            }
            if (!r) throw new Error('No pudimos comunicarnos con el servidor del CIC. Intenta de nuevo.');
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(j.mensaje || 'No pudimos completar la solicitud.');
            return j;
        }

        // ---------- Ingreso ----------
        if (!(FB.apiKey && FB.projectId)) { $('#aviso-demo').hidden = false; $('#form-login button[type="submit"]').disabled = true; }
        const msj = (t, ok) => { const m = $('#login-msj'); m.textContent = t; m.className = 'mensaje ' + (ok ? 'ok' : 'error'); m.hidden = !t; };
        $('#form-login').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const f = ev.currentTarget, b = $('button[type="submit"]', f);
            const correo = f.correo.value.trim(), clave = f.clave.value;
            if (!correo || !clave) return msj('Escribe tu correo y tu contraseña.');
            b.disabled = true; b.textContent = 'Un momento…';
            try {
                await conectar();
                await auth.signInWithEmailAndPassword(correo, clave);
                await entrar();
            } catch (e) { msj(/password|credential|user/i.test(e.code || '') ? 'El correo o la contraseña no coinciden.' : e.message); }
            finally { b.disabled = false; b.textContent = 'Ingresar'; }
        });
        $('#olvide').addEventListener('click', async () => {
            const correo = $('#ad-correo').value.trim();
            if (!correo) return msj('Escribe tu correo arriba y vuelve a tocar «¿Olvidaste tu contraseña?».');
            try { await conectar(); await auth.sendPasswordResetEmail(correo); } catch (e) { /* misma respuesta siempre */ }
            msj('Si ese correo es de una cuenta de administración, te llegó un enlace para crear una contraseña nueva.', true);
        });
        $('#salir').addEventListener('click', async () => { if (auth) await auth.signOut(); location.reload(); });

        async function entrar() {
            const { perfil } = await llamar('mi-perfil');
            if (!perfil || perfil.rol !== 'administradora') { await auth.signOut(); throw new Error('Esta cuenta no tiene permisos de administración.'); }
            yo = perfil;
            $('#vista-login').hidden = true;
            $('#vista-panel').hidden = false;
            $('#salir').hidden = false;
            await recargar();
        }
        (async () => {
            if (!(FB.apiKey && FB.projectId)) return;
            try {
                await conectar();
                const u = await new Promise((ok) => { const fin = auth.onAuthStateChanged((x) => { fin(); ok(x); }); });
                if (u) await entrar();
            } catch (e) { /* queda en el ingreso */ }
        })();

        // ---------- Pestañas ----------
        $$('[data-tab]').forEach((b) => b.addEventListener('click', () => {
            $$('[data-tab]').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
            ['cursos', 'grabaciones', 'soporte', 'correos', 'equipo', 'admins', 'novedades', 'finalizacion'].forEach((t) => { $(`#tab-${t}`).hidden = b.dataset.tab !== t; });
            if (b.dataset.tab === 'soporte') window.CICSoporte.pintar($('#tab-soporte'), { perfil: yo, esc, aviso, pedir: llamar, satelite: (id) => DATOS.satelites.find((x) => x.id === id) || null });
            if (b.dataset.tab === 'correos') pintarCorreos();
            if (b.dataset.tab === 'equipo') pintarEquipo();
            if (b.dataset.tab === 'admins') pintarAdmins();
            if (b.dataset.tab === 'novedades') pintarNovedades();
            if (b.dataset.tab === 'finalizacion') pintarFinalizacion();
        }));

        // ---------- Registro de correos de contraseña (colección «envios_correo» de Firestore) ----------
        const ESTADO_ENVIO = { enviado: ['Enviado', 'sop-resuelto'], fallido: ['Falló', 'sop-abierto'], omitido: ['No se envió', 'sop-cerrado'] };
        let soloProblemas = false;
        async function pintarCorreos() {
            const caja = $('#tab-correos');
            caja.innerHTML = '<p class="vista-intro">Cargando…</p>';
            let r;
            try { r = await llamar('envios-correo'); } catch (e) { caja.innerHTML = `<p class="mensaje error">${esc(e.message)}</p>`; return; }
            const filas = r.envios.filter((x) => !soloProblemas || x.estado !== 'enviado');
            const cuenta = (e) => r.envios.filter((x) => x.estado === e).length;
            caja.innerHTML = `
                <p class="vista-intro">Cada vez que alguien pide el enlace para crear o cambiar su contraseña queda aquí: si se envió, si falló (con el motivo que dio Google) o por qué no se envió. Se muestran los últimos 300.</p>
                <p><span class="chip sop-resuelto">${cuenta('enviado')} enviados</span> <span class="chip sop-abierto">${cuenta('fallido')} fallidos</span> <span class="chip sop-cerrado">${cuenta('omitido')} no enviados</span>
                <label style="margin-left:1rem"><input type="checkbox" id="solo-problemas" ${soloProblemas ? 'checked' : ''}> Ver solo los que no se enviaron</label></p>
                <div class="tabla-caja"><table><thead><tr><th scope="col">Fecha</th><th scope="col">Persona</th><th scope="col">Correo</th><th scope="col">Estado</th><th scope="col">Detalle</th></tr></thead>
                <tbody>${filas.map((x) => `<tr><td style="white-space:nowrap">${esc(new Date(x.creado_en).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }))}</td>
                    <td><b>${esc(x.nombre || 'Sin registro')}</b><small>CC ${esc(x.cedula)}${x.rol ? ' · ' + esc(x.rol) : ''}</small></td>
                    <td>${esc(x.correo || '—')}</td>
                    <td><span class="chip ${(ESTADO_ENVIO[x.estado] || [])[1] || ''}">${esc((ESTADO_ENVIO[x.estado] || [x.estado])[0])}</span></td>
                    <td><small>${esc(x.error || x.motivo || '')}</small></td></tr>`).join('') || '<tr><td colspan="5">Todavía no hay registros.</td></tr>'}</tbody></table></div>`;
            $('#solo-problemas').addEventListener('change', (e) => { soloProblemas = e.target.checked; pintarCorreos(); });
        }

        // ---------- Registro de secretarías y dinamizadoras (colección «directorio») ----------
        const NOMBRE_ROL = { secretaria: 'Secretaría Técnica', dinamizadora: 'Dinamizadora (o dinamizador)' };
        let equipoDatos = null, filtroEquipo = '';
        async function pintarEquipo(editar) {
            const caja = $('#tab-equipo');
            if (!equipoDatos) {
                caja.innerHTML = '<p class="vista-intro">Cargando…</p>';
                try { equipoDatos = await llamar('admin-equipo'); } catch (e) { caja.innerHTML = `<p class="mensaje error">${esc(e.message)}</p>`; return; }
            }
            const x = editar || {};
            const otroRol = x.otros_roles ? Object.keys(x.otros_roles)[0] : '';
            const otro = otroRol ? x.otros_roles[otroRol] : {};
            const opcionesSat = (sel) => '<option value="">Sin satélite</option>' + equipoDatos.satelites.map((s) => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.departamento)} · ${esc(s.municipios.join(', '))}</option>`).join('');
            const opcionesRol = (sel, vacio) => (vacio ? '<option value="">No tiene</option>' : '') + Object.entries(NOMBRE_ROL).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v}</option>`).join('');
            caja.innerHTML = `
                <div class="tarjeta" style="display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;margin-bottom:1rem">
                    <p style="margin:0"><b>Avance en los cursos</b><br><small>Te llega a 2horas.online01@gmail.com un correo con cómo va cada secretaria y dinamizadora (Gestión, HACER y SER).</small></p>
                    <button type="button" class="btn btn-borde btn-pequeno" id="enviar-reporte">📧 Enviarme el avance por correo</button>
                </div>
                <p class="vista-intro">Registra aquí a las secretarías y dinamizadoras. Apenas la guardes, la persona entra a la página → <b>Ingresar</b> → su perfil → <b>Activar mi cuenta</b>, escribe su cédula y le llega al correo el enlace para crear su contraseña. Las emprendedoras se inscriben solas desde la página.</p>
                <form id="form-equipo" class="tarjeta" novalidate style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.5rem 1rem;align-items:end">
                    <h3 class="subtitulo-seccion" style="grid-column:1/-1;margin:0 0 .4rem">${editar ? 'Editar a ' + esc(x.nombre) : 'Registrar a una persona del equipo'}</h3>
                    <label><span class="etiqueta">Cédula</span><input class="campo" name="cedula" inputmode="numeric" required value="${esc(x.cedula || '')}" ${editar ? 'readonly' : ''}></label>
                    <label><span class="etiqueta">Nombre y apellido</span><input class="campo" name="nombre" required value="${esc(x.nombre || '')}"></label>
                    <label><span class="etiqueta">Correo (le llega el enlace)</span><input class="campo" name="correo" type="email" required value="${esc(x.correo || '')}"></label>
                    <label><span class="etiqueta">Celular</span><input class="campo" name="celular" inputmode="tel" value="${esc(x.celular || '')}"></label>
                    <label><span class="etiqueta">Perfil</span><select class="campo" name="rol">${opcionesRol(x.rol || 'dinamizadora')}</select></label>
                    <label><span class="etiqueta">Satélite (obligatorio para dinamizadora)</span><select class="campo" name="satelite">${opcionesSat(x.satelite)}</select></label>
                    <label><span class="etiqueta">Cargo</span><input class="campo" name="cargo" placeholder="Ej.: Acompañamiento - Sucre" value="${esc(x.cargo || '')}"></label>
                    <label><span class="etiqueta">Subtítulo (opcional)</span><input class="campo" name="subtitulo" placeholder="Ej.: Soporte a la Transferencia" value="${esc(x.subtitulo || '')}"></label>
                    <fieldset style="grid-column:1/-1;border:1px dashed rgba(46,74,62,.3);border-radius:12px;padding:.6rem 1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.5rem 1rem">
                        <legend class="etiqueta">Segundo perfil (si también es secretaría o dinamizadora)</legend>
                        <label><span class="etiqueta">Perfil</span><select class="campo" name="otro_rol">${opcionesRol(otroRol, true)}</select></label>
                        <label><span class="etiqueta">Satélite</span><select class="campo" name="otro_satelite">${opcionesSat(otro.satelite)}</select></label>
                        <label><span class="etiqueta">Cargo</span><input class="campo" name="otro_cargo" value="${esc(otro.cargo || '')}"></label>
                    </fieldset>
                    <p class="mensaje" id="equipo-msj" role="alert" style="grid-column:1/-1;margin:0"></p>
                    <div class="botones" style="grid-column:1/-1;margin-top:0"><button class="btn btn-primario" type="submit">${editar ? 'Guardar cambios' : 'Registrar'}</button>${editar ? '<button class="btn btn-borde" type="button" id="equipo-cancelar">Cancelar</button>' : ''}</div>
                </form>
                <p style="margin-top:1.2rem"><label><span class="etiqueta">Buscar</span> <input class="campo" id="equipo-buscar" placeholder="Nombre, cédula, cargo o satélite" value="${esc(filtroEquipo)}" style="max-width:320px"></label> <small>${equipoDatos.personas.length} personas en el equipo</small></p>
                <div class="tabla-caja"><table><thead><tr><th scope="col">Persona</th><th scope="col">Perfil</th><th scope="col">Satélite</th><th scope="col">Cuenta</th><th scope="col"></th></tr></thead>
                <tbody id="equipo-filas"></tbody></table></div>`;
            // Satélite (no el departamento): el Cesar tiene dos, Valledupar y Pueblo Bello
            const nombreSatelite = (id) => { const s = equipoDatos.satelites.find((x) => x.id === id); return s ? s.municipios.join(' y ') + ' (' + s.departamento + ')' : (id ? id : 'Sin satélite'); };
            const pintarFilas = () => {
                const q = filtroEquipo.toLowerCase();
                const filas = equipoDatos.personas.filter((p) => !q || (p.nombre + ' ' + p.cedula + ' ' + (p.cargo || '') + ' ' + nombreSatelite(p.satelite)).toLowerCase().includes(q));
                $('#equipo-filas').innerHTML = filas.map((p) => `<tr><td><b>${esc(p.nombre)}</b><small>CC ${esc(p.cedula)} · ${esc(p.correo || 'sin correo')}</small></td>
                    <td>${esc(NOMBRE_ROL[p.rol] || p.rol)}${p.otros_roles ? ' + ' + Object.keys(p.otros_roles).map((k) => esc(NOMBRE_ROL[k] || k)).join(', ') : ''}<small>${esc(p.subtitulo || p.cargo || '')}</small></td>
                    <td>${esc(nombreSatelite(p.satelite))}${p.otros_roles && p.otros_roles.dinamizadora && p.otros_roles.dinamizadora.satelite ? '<small>2.º perfil: ' + esc(nombreSatelite(p.otros_roles.dinamizadora.satelite)) + '</small>' : ''}</td>
                    <td><span class="chip ${p.activada ? 'sop-resuelto' : 'sop-cerrado'}">${p.activada ? 'Activada' : 'Sin activar'}</span></td>
                    <td><button type="button" class="boton-texto" data-editar-persona="${esc(p.cedula)}">Editar</button></td></tr>`).join('') || '<tr><td colspan="5">No hay coincidencias.</td></tr>';
                $$('[data-editar-persona]').forEach((b) => b.addEventListener('click', () => { pintarEquipo(equipoDatos.personas.find((p) => p.cedula === b.dataset.editarPersona)); window.scrollTo({ top: 0, behavior: 'smooth' }); }));
            };
            pintarFilas();
            $('#equipo-buscar').addEventListener('input', (e) => { filtroEquipo = e.target.value; pintarFilas(); });
            if (editar) $('#equipo-cancelar').addEventListener('click', () => pintarEquipo());
            $('#enviar-reporte').addEventListener('click', async (ev) => {
                const b = ev.currentTarget;
                b.disabled = true; b.textContent = 'Enviando…';
                try { const r = await llamar('reporte-avance'); aviso(`Listo: te llegó el avance de ${r.personas} personas a ${r.correo}.`); b.textContent = '✓ Enviado'; }
                catch (e) { aviso(e.message); b.disabled = false; b.textContent = '📧 Enviarme el avance por correo'; }
            });
            $('#form-equipo').addEventListener('submit', async (e) => {
                e.preventDefault();

        async function recargar() {
            contenido = await llamar('admin-contenido');
            pintarCursos();
            pintarGrabaciones();
        }

        // Duración de los videos: se escribe como en el reproductor (12:35) y se guarda en minutos (12.58)
        const minutosAdmin = (t) => { const m = String(t || '').trim().match(/^(\d{1,3})(?:[:.,](\d{1,2}))?$/); if (!m) return 0; const seg = Number(m[2] || 0); return seg > 59 ? 0 : Math.round((Number(m[1]) + seg / 60) * 100) / 100; };
        const minSegAdmin = (min) => { if (!min) return ''; const s = Math.round(min * 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
        // ---------- Videos y material de cada unidad ----------
        const lineasMaterial = (archivos) => archivos.map((a) => `${a.nombre} | ${a.url}`).join('\n');
        const leerMaterial = (txt) => txt.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
            const i = l.lastIndexOf('|');
            return i > 0 ? { nombre: l.slice(0, i).trim(), url: l.slice(i + 1).trim() } : { nombre: 'Material', url: l };
        });
        const enlaceVideo = (v) => !v ? '' : v.drive_id ? `https://drive.google.com/file/d/${v.drive_id}/view` : `https://youtu.be/${v.youtube_id}`;

        function pintarCursos() {
            const bv = contenido.bienvenida;
            $('#tab-cursos').innerHTML = `

                        <h4 id="t-bv"><span class="codigo">BIENVENIDA</span> Video de bienvenida · obligatorio <small class="${bv ? 'estado-ok' : 'estado-falta'}">${bv ? 'publicado: ya se exige antes del curso Gestión del CIC' : 'falta: mientras no haya video, el curso Gestión se abre sin este paso'}</small></h4>
                        <p class="texto-suave" style="grid-column:1/-1;margin:0">Todas las secretarias y dinamizadoras deben ver este video de presentación completo (toda su duración, con la página abierta) para desbloquear el curso Gestión del CIC.</p>
                        <form class="form-bienvenida" novalidate>
                            <label class="etiqueta" for="v-bv">Enlace de Google Drive (o YouTube)</label>
                            <input class="campo" id="v-bv" name="url" type="url" placeholder="https://drive.google.com/file/d/…/view" value="${esc(enlaceVideo(bv))}">
                            <label class="etiqueta" for="d-bv">Duración exacta (minutos:segundos, como sale en el reproductor)</label>
                            <input class="campo" id="d-bv" name="duracion" inputmode="numeric" placeholder="Ej.: 12:35" required value="${esc(bv ? minSegAdmin(bv.duracion_min) : '')}">
                            <div class="fila-btn"><button type="submit" class="btn btn-primario btn-pequeno">Guardar video de bienvenida</button>${bv ? '<button type="button" class="btn btn-borde btn-pequeno" data-quitar-bienvenida>Quitar</button>' : ''}</div>
                        </form>
                    </div>
                </section>
                <p class="vista-intro">Pega el enlace de cada video de Google Drive (compártelo como «Cualquier persona con el enlace · Lector») y su duración exacta (minutos:segundos): la evaluación se habilita cuando la persona ve el video completo, con la página abierta y el video en pantalla. Las guías en PDF ya están cargadas en la plataforma; si quieres sumar otro material, escribe una línea por archivo: <b>Nombre | enlace</b>.</p>
                ${Object.entries(contenido.cursos).map(([id, c]) => {
                    const conVideo = c.unidades.filter((u) => u.video).length;
                    return `<details class="curso-admin" ${id === 'gestion' ? 'open' : ''}>
                        <summary><span>${esc(c.nombre)}</span><small>${conVideo} de ${c.unidades.length} videos · ${c.unidades.filter((u) => u.material.length).length} con material</small></summary>
                        ${c.unidades.map((u) => `<div class="unidad-admin" data-curso="${esc(id)}" data-unidad="${u.unidad}">
                            <h4><span class="codigo">${esc(u.codigo)}</span> ${esc(NOMBRE_U[id])} ${u.unidad} · ${esc((TITULOS[id] || [])[u.unidad - 1] || '')}
                                ${c.cuestionario ? `<small class="${u.preguntas ? 'estado-ok' : 'estado-falta'}">${u.preguntas ? `${u.preguntas} preguntas en el banco` : 'sin preguntas cargadas'}</small>` : '<small class="texto-suave">material de consulta de la Secretaría (sin evaluación)</small>'}</h4>
                            <form class="form-video" novalidate>
                                <b>Video ${u.video ? '<span class="estado-ok">· publicado</span>' : '<span class="estado-falta">· falta</span>'}</b>
                                <label class="etiqueta" for="v-${esc(u.codigo)}">Enlace de Google Drive (o YouTube)</label>
                                <input class="campo" id="v-${esc(u.codigo)}" name="url" type="url" placeholder="https://drive.google.com/file/d/…/view" value="${esc(enlaceVideo(u.video))}">
                                <label class="etiqueta" for="d-${esc(u.codigo)}">Duración exacta (minutos:segundos) · se exige verlo completo</label>
                                <input class="campo" id="d-${esc(u.codigo)}" name="duracion" inputmode="numeric" placeholder="Ej.: 26:10" required value="${esc(u.video ? minSegAdmin(u.video.duracion_min) : '')}">
                                <div class="fila-btn"><button type="submit" class="btn btn-primario btn-pequeno">Guardar video</button>${u.video ? '<button type="button" class="btn btn-borde btn-pequeno" data-quitar-video>Quitar</button>' : ''}</div>
                            </form>
                            <form class="form-material" novalidate>
                                ${(u.archivos || []).length ? `<b>PDF de la plataforma <span class="estado-ok">· ${u.archivos.length}</span></b><ul class="pdf-admin">${u.archivos.map((n) => `<li>📄 ${esc(n)}</li>`).join('')}</ul>` : ''}

                            </form>
                        </div>`).join('')}
                    </details>`;

        }

        $('#tab-cursos').addEventListener('submit', async (ev) => {

                    await llamar('guardar-video', { video: { codigo: 'BIENVENIDA', titulo: 'Bienvenida al Centro de Innovación Comunitaria', url: f.url.value.trim(), duracion_min: duracion, audiencia: 'equipo', curso: 'bienvenida', unidad: 1 } });

            }
            const curso = caja.dataset.curso, unidad = Number(caja.dataset.unidad);

            const b = $('button[type="submit"]', f);
            b.disabled = true;
            try {
                if (f.classList.contains('form-video')) {
                    const duracion = minutosAdmin(f.duracion.value);
                    if (!f.url.value.trim()) throw new Error('Pega el enlace del video.');
                    if (!duracion) throw new Error('Escribe la duración exacta del video en minutos y segundos, por ejemplo 12:35.');
                    await llamar('guardar-video', { video: { codigo: `${c.prefijo}${unidad}`, titulo: `${c.nombre} · ${NOMBRE_U[curso]} ${unidad}: ${(TITULOS[curso] || [])[unidad - 1] || ''}`, url: f.url.value.trim(), duracion_min: duracion, audiencia: 'equipo', curso, unidad } });
                    aviso(`Video ${c.prefijo}${unidad} guardado.`);
                } else {
                    await llamar('admin-guardar-material', { curso, unidad, archivos: leerMaterial(f.material.value) });
                    aviso(`Material de ${c.prefijo}${unidad} guardado.`);
                }
                await recargar();
            } catch (e) { aviso(e.message); b.disabled = false; }
        });
        $('#tab-cursos').addEventListener('click', async (ev) => {
            if (ev.target.closest('[data-quitar-bienvenida]')) {
                if (!confirm('¿Quitar el video de bienvenida? El curso Gestión se abrirá sin este paso. El archivo sigue en Drive.')) return;
                try { await llamar('quitar-video', { codigo: 'BIENVENIDA' }); aviso('Video de bienvenida quitado.'); await recargar(); } catch (e) { aviso(e.message); }
                return;
            }
            const b = ev.target.closest('[data-quitar-video]');

            const caja = b.closest('.unidad-admin');

        // ---------- Grabaciones de los talleres virtuales (las ven las emprendedoras de ese satélite) ----------
        function pintarGrabaciones() {
            const virtuales = DATOS.ser.filter((t) => t.modalidad === 'Virtual');
            $('#tab-grabaciones').innerHTML = `
                <p class="vista-intro">Las grabaciones de los talleres virtuales aparecen en el panel de las emprendedoras del satélite elegido (o de todos).</p>

            const codigo = `GRAB-SER${t.n}-${sat ? sat.codigo : 'TODOS'}-${f.fecha.value.replace(/-/g, '')}`;
            try {
                await llamar('guardar-video', { video: { codigo, titulo: `Grabación · Taller SER ${t.n} · ${t.titulo}${sat ? ` · ${sat.nombre}` : ''}`, url: f.url.value.trim(), duracion_min: Number(f.duracion.value) || null, audiencia: 'emprendedoras', curso: 'grabaciones', unidad: t.n, satelite: sat ? sat.id : null, fecha: f.fecha.value } });
                aviso(`Grabación ${codigo} publicada.`);
                await recargar();
            } catch (e) { aviso(e.message); }
        });
        $('#tab-grabaciones').addEventListener('click', async (ev) => {
            const b = ev.target.closest('[data-quitar-grab]');
            if (!b || !confirm(`¿Quitar la grabación ${b.dataset.quitarGrab}?`)) return;
            try { await llamar('quitar-video', { codigo: b.dataset.quitarGrab }); aviso('Grabación quitada.'); await recargar(); } catch (e) { aviso(e.message); }
        });
    })();
    </script>
<script>
        (() => {
            const marcar = (raiz) => raiz.querySelectorAll('.tabla-caja table').forEach((t) => {
                const titulos = [...t.querySelectorAll('thead th')].map((th) => th.textContent.trim());
                t.querySelectorAll('tbody tr').forEach((tr) => [...tr.children].forEach((td, i) => { if (titulos[i] && !td.dataset.etiqueta) td.dataset.etiqueta = titulos[i]; }));
            });
            const raiz = document.querySelector('#plataforma, #vista-panel');
            if (raiz) new MutationObserver(() => marcar(raiz)).observe(raiz, { childList: true, subtree: true });
        })();
    </script>
</body>
</html>
